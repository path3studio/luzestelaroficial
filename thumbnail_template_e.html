<!DOCTYPE html>
<!--
Thumbnail Variant E — "EL PERSONAJE" (added 2026-08-04)
La idea que el usuario propuso en julio: usar el elenco propio en las
portadas. El retrato del signo del día (remotion/public/personajes/) ocupa la
derecha; a la izquierda, el nombre del signo y el gancho del día. Un rostro
mirando a cámara es el patrón de mayor CTR conocido en YouTube — esta variante
lo prueba CON nuestros personajes, no con stock.
{{CHAR_IMG}} llega como file:// absoluto desde thumbnail_generator.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4a849;--gold-light:#f0d078;--navy:#12102a;--navy2:#1c1838}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:720px;overflow:hidden;position:relative;
       background:#12102a url("{{COSMIC_BG}}") center/cover no-repeat;
       font-family:'Inter',sans-serif;color:#fff}
  /* velo bajo el texto: la galaxia acompaña, el texto manda */
  .velo{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,30,.9) 0%,rgba(18,16,42,.78) 40%,rgba(18,16,42,.3) 62%,transparent 100%)}
  .foto{position:absolute;right:0;top:0;bottom:0;width:600px;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:top center}
  /* fundido hacia el fondo para que el retrato pertenezca a la escena */
  .foto::after{content:'';position:absolute;inset:0;
       background:linear-gradient(90deg,var(--navy) 0%,rgba(18,16,42,.35) 22%,transparent 55%),
                  linear-gradient(0deg,rgba(11,10,30,.75) 0%,transparent 30%)}
  .marco{position:absolute;inset:22px;border:2px solid rgba(212,168,73,.5);
       border-radius:18px;z-index:3}
  .contenido{position:absolute;left:96px;top:0;bottom:0;width:640px;z-index:2;
       display:flex;flex-direction:column;justify-content:center;gap:10px}
  .hoy{font-size:30px;font-weight:700;letter-spacing:.3em;color:var(--gold);
       text-transform:uppercase}
  .signo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:150px;
       line-height:.94;text-transform:uppercase;
       background:linear-gradient(180deg,#fff 20%,var(--gold-light) 60%,var(--gold) 100%);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
  .gancho{font-size:40px;font-weight:800;line-height:1.22;max-width:600px;
       color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.75)}
  .sello{position:absolute;left:96px;bottom:60px;z-index:3;
       font-size:24px;font-weight:700;color:var(--gold);
       border:2px solid rgba(212,168,73,.65);border-radius:999px;padding:9px 24px;
       letter-spacing:.08em;background:rgba(18,16,42,.72)}
  .brand{position:absolute;left:96px;top:44px;z-index:3;display:flex;align-items:center;gap:12px}
  .brand img{height:48px;width:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.75))}
  .brand span{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.28em;
       color:rgba(240,208,120,.95);text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.8)}
</style>
</head>
<body>
  <div class="velo"></div>
  <div class="foto"><img src="{{CHAR_IMG}}" alt=""></div>
  <div class="marco"></div>
  <div class="contenido">
    <div class="hoy">Hoy el cielo habla a</div>
    <div class="signo">{{SIGN_NAME}}</div>
    <div class="gancho">{{TRANSIT_LINE}}</div>
  </div>
  <div class="sello">{{DATE_TEXT}} · {{YEAR}}</div>
  <div class="brand"><img src="{{LOGO}}" alt=""><span>Luz Estelar</span></div>
</body>
</html>
